<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlixTime - Hindi Hits</title>
    <style>
        :root {
            --bg-color: #0A1128;
            --accent-color: #FF0044;
            --text-color: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; padding-bottom: 20px; }
        header { position: sticky; top: 0; background: rgba(10, 17, 40, 0.95); padding: 15px; z-index: 100; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: var(--accent-color); font-size: 24px; font-weight: 800; text-transform: uppercase; text-align: center; }
        input { width: 100%; padding: 12px 15px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: white; font-size: 16px; outline: none; }
        .category { margin-top: 25px; padding-left: 15px; }
        h2 { font-size: 18px; margin-bottom: 12px; border-left: 4px solid var(--accent-color); padding-left: 8px; }
        .row { display: flex; overflow-x: auto; gap: 12px; padding-right: 15px; padding-bottom: 10px; scrollbar-width: none; }
        .row::-webkit-scrollbar { display: none; }
        .poster { width: 130px; height: 195px; object-fit: cover; border-radius: 8px; cursor: pointer; flex-shrink: 0; background: #1a2238; }
        
        #playerModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 1000; display: none; flex-direction: column; }
        .player-header { background: #111; padding: 10px 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .server-btns { display: flex; gap: 5px; }
        .btn { background: #333; color: white; border: 1px solid #555; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn.active { background: var(--accent-color); border-color: var(--accent-color); font-weight: bold; }
        #closeBtn { background: transparent; color: white; border: 1px solid white; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .iframe-container { flex-grow: 1; width: 100%; background: #000; display: flex; justify-content: center; align-items: center; }
        #playerIframe { width: 100%; height: 100%; border: none; }
        #loadingMsg { text-align: center; padding: 15px; color: var(--accent-color); display: none; }
    </style>
</head>
<body>

    <header>
        <h1>FlixTime</h1>
        <input type="text" id="searchInput" placeholder="Search Hindi Movies...">
    </header>

    <main>
        <div id="loadingMsg">Searching...</div>
        <div id="searchResults" class="category" style="display:none;">
            <h2>Search Results</h2>
            <div class="row" id="searchRow"></div>
        </div>

        <div class="category"><h2>🔥 Trending Hindi Hits</h2><div class="row" id="trendingRow"></div></div>
        <div class="category"><h2>💥 Action Blockbusters</h2><div class="row" id="actionRow"></div></div>
        <div class="category"><h2>😂 Comedy Superhits</h2><div class="row" id="comedyRow"></div></div>
        <div class="category"><h2>👻 Horror Movies</h2><div class="row" id="horrorRow"></div></div>
        <div class="category"><h2>❤️ Romantic Hits</h2><div class="row" id="romanceRow"></div></div>
    </main>

    <div id="playerModal">
        <div class="player-header">
            <div class="server-btns">
                <button class="btn active" id="btn1" onclick="changeServer(1)">Server 1 (.to)</button>
                <button class="btn" id="btn2" onclick="changeServer(2)">Server 2 (.me)</button>
                <button class="btn" id="btn3" onclick="changeServer(3)">Server 3 (.net)</button>
            </div>
            <button id="closeBtn">X Close</button>
        </div>
        <div class="iframe-container">
            <iframe id="playerIframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_KEY = '2d45e26903f728b925fea962b8e7ddf0';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        
        const today = new Date().toISOString().split('T')[0];

        const categories = [
            { id: 'trendingRow', url: `/discover/movie?api_key=${API_KEY}&with_original_language=hi&primary_release_date.lte=${today}&sort_by=popularity.desc` },
            { id: 'actionRow', url: `/discover/movie?api_key=${API_KEY}&with_original_language=hi&with_genres=28&primary_release_date.lte=${today}&sort_by=popularity.desc` },
            { id: 'comedyRow', url: `/discover/movie?api_key=${API_KEY}&with_original_language=hi&with_genres=35&primary_release_date.lte=${today}&sort_by=popularity.desc` },
            { id: 'horrorRow', url: `/discover/movie?api_key=${API_KEY}&with_original_language=hi&with_genres=27&primary_release_date.lte=${today}&sort_by=popularity.desc` },
            { id: 'romanceRow', url: `/discover/movie?api_key=${API_KEY}&with_original_language=hi&with_genres=10749&primary_release_date.lte=${today}&sort_by=popularity.desc` }
        ];

        function fetchMovies(url, rowId) {
            fetch(BASE_URL + url).then(res => res.json()).then(data => {
                const row = document.getElementById(rowId);
                data.results?.forEach(item => {
                    if(item.poster_path) {
                        const img = document.createElement('img');
                        img.src = IMG_URL + item.poster_path;
                        img.className = 'poster';
                        img.onclick = () => selectMovie(item);
                        row.appendChild(img);
                    }
                });
            });
        }
        categories.forEach(cat => fetchMovies(cat.url, cat.id));

        const searchInput = document.getElementById('searchInput');
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            if (!query) { document.getElementById('searchResults').style.display = 'none'; return; }
            
            document.getElementById('loadingMsg').style.display = 'block';
            debounceTimer = setTimeout(() => {
                fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${encodeURIComponent(query)}&primary_release_date.lte=${today}`)
                    .then(res => res.json())
                    .then(data => {
                        const row = document.getElementById('searchRow');
                        row.innerHTML = '';
                        document.getElementById('loadingMsg').style.display = 'none';
                        const results = data.results?.filter(item => item.poster_path) || [];
                        if(results.length > 0) {
                            document.getElementById('searchResults').style.display = 'block';
                            results.forEach(item => {
                                const img = document.createElement('img');
                                img.src = IMG_URL + item.poster_path;
                                img.className = 'poster';
                                img.onclick = () => selectMovie(item);
                                row.appendChild(img);
                            });
                        }
                    });
            }, 600);
        });

        let currentId = '';

        function selectMovie(item) {
            currentId = item.id;
            
            changeServer(1); 
            
            document.getElementById('playerModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function changeServer(num) {
            document.getElementById('btn1').classList.remove('active');
            document.getElementById('btn2').classList.remove('active');
            document.getElementById('btn3').classList.remove('active');
            document.getElementById(`btn${num}`).classList.add('active');

            const iframe = document.getElementById('playerIframe');
            
            // Sabse stable Vidsrc Original domains
            if(num === 1) {
                iframe.src = `https://vidsrc.to/embed/movie/${currentId}`; 
            } else if(num === 2) {
                iframe.src = `https://vidsrc.me/embed/movie/${currentId}`; 
            } else if(num === 3) {
                iframe.src = `https://vidsrc.net/embed/movie/${currentId}`; 
            }
        }

        document.getElementById('closeBtn').onclick = () => {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('playerIframe').src = '';
            document.body.style.overflow = '';
        };
    </script>
</body>
</html>
