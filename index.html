<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlixTime - Fresh Start</title>
    <style>
        :root {
            --bg-color: #0A1128;
            --accent-color: #FF0044;
            --text-color: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); overflow-x: hidden; padding-bottom: 20px; }
        header { position: sticky; top: 0; background: rgba(10, 17, 40, 0.95); padding: 15px; z-index: 100; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: var(--accent-color); font-size: 24px; font-weight: 800; text-transform: uppercase; text-align: center; }
        input { width: 100%; padding: 12px 15px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: white; font-size: 16px; outline: none; }
        .category { margin-top: 25px; padding-left: 15px; }
        h2 { font-size: 18px; margin-bottom: 12px; border-left: 4px solid var(--accent-color); padding-left: 8px; }
        .row { display: flex; overflow-x: auto; gap: 12px; padding-right: 15px; padding-bottom: 10px; scrollbar-width: none; }
        .row::-webkit-scrollbar { display: none; }
        .poster { width: 130px; height: 195px; object-fit: cover; border-radius: 8px; cursor: pointer; flex-shrink: 0; background: #1a2238; }
        #playerModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 1000; display: none; flex-direction: column; }
        .player-header { background: #111; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .player-title { color: var(--accent-color); font-weight: bold; }
        #closeBtn { background: transparent; color: white; border: 1px solid white; padding: 5px 15px; border-radius: 4px; cursor: pointer; }
        .iframe-container { flex-grow: 1; width: 100%; background: #000; }
        #playerIframe { width: 100%; height: 100%; border: none; }
        #loadingMsg { text-align: center; padding: 15px; color: var(--accent-color); display: none; }
    </style>
</head>
<body>

    <header>
        <h1>FlixTime</h1>
        <input type="text" id="searchInput" placeholder="Search movies, shows...">
    </header>

    <main>
        <div id="loadingMsg">Searching...</div>
        <div id="searchResults" class="category" style="display:none;">
            <h2>Search Results</h2>
            <div class="row" id="searchRow"></div>
        </div>
        <div class="category"><h2>🔥 Latest Releases</h2><div class="row" id="latestRow"></div></div>
        <div class="category"><h2>Hollywood Blockbusters</h2><div class="row" id="hollywoodRow"></div></div>
        <div class="category"><h2>Bollywood Hits</h2><div class="row" id="bollywoodRow"></div></div>
    </main>

    <div id="playerModal">
        <div class="player-header">
            <div class="player-title">FlixTime Direct Player</div>
            <button id="closeBtn">X Close</button>
        </div>
        <div class="iframe-container">
            <iframe id="playerIframe" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const API_KEY = '2d45e26903f728b925fea962b8e7ddf0';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';

        const categories = [
            { id: 'latestRow', url: `/movie/now_playing?api_key=${API_KEY}&region=IN` },
            { id: 'hollywoodRow', url: `/discover/movie?api_key=${API_KEY}&with_original_language=en&sort_by=popularity.desc` },
            { id: 'bollywoodRow', url: `/discover/movie?api_key=${API_KEY}&with_original_language=hi&sort_by=popularity.desc` }
        ];

        function fetchMovies(url, rowId) {
            fetch(BASE_URL + url).then(res => res.json()).then(data => {
                const row = document.getElementById(rowId);
                data.results?.forEach(item => {
                    if(item.poster_path) {
                        const img = document.createElement('img');
                        img.src = IMG_URL + item.poster_path;
                        img.className = 'poster';
                        img.onclick = () => selectMovie(item);
                        row.appendChild(img);
                    }
                });
            });
        }
        categories.forEach(cat => fetchMovies(cat.url, cat.id));

        const searchInput = document.getElementById('searchInput');
        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();
            if (!query) { document.getElementById('searchResults').style.display = 'none'; return; }
            
            document.getElementById('loadingMsg').style.display = 'block';
            debounceTimer = setTimeout(() => {
                fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`)
                    .then(res => res.json())
                    .then(data => {
                        const row = document.getElementById('searchRow');
                        row.innerHTML = '';
                        document.getElementById('loadingMsg').style.display = 'none';
                        const results = data.results?.filter(item => (item.media_type === 'movie' || item.media_type === 'tv') && item.poster_path) || [];
                        if(results.length > 0) {
                            document.getElementById('searchResults').style.display = 'block';
                            results.forEach(item => {
                                const img = document.createElement('img');
                                img.src = IMG_URL + item.poster_path;
                                img.className = 'poster';
                                img.onclick = () => selectMovie(item);
                                row.appendChild(img);
                            });
                        }
                    });
            }, 600);
        });

        // Direct Vidsrc Play Logic (No Backend Needed)
        function selectMovie(item) {
            const tmdb_id = item.id;
            const type = item.media_type === 'tv' ? 'tv' : 'movie';
            
            // Seedha Vidsrc link banaya aur iframe me daal diya
            document.getElementById('playerIframe').src = `https://vidsrc.to/embed/${type}/${tmdb_id}`;
            document.getElementById('playerModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('closeBtn').onclick = () => {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('playerIframe').src = '';
            document.body.style.overflow = '';
        };
    </script>
</body>
</html>
